<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/app/inicio" text="Voltar"></ion-back-button>
    </ion-buttons>
    <ion-title>Meu perfil <span class="enfeite" aria-hidden="true">📚</span></ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="conteudo">
    <ion-segment [value]="aba()" (ionChange)="aba.set($any($event).detail.value)">
      <ion-segment-button value="avatar"><ion-label>Avatares</ion-label></ion-segment-button>
      <ion-segment-button value="estante"><ion-label>Minha estante</ion-label></ion-segment-button>
    </ion-segment>
    @if (aba() === 'avatar') {
    <section class="secao">
      <app-avatar-seletor [(escolhido)]="avatarId"></app-avatar-seletor>
    </section>

    <section class="secao campos">
      <ion-input
        label="Seu nome"
        labelPlacement="stacked"
        fill="outline"
        [value]="nome()"
        (ionInput)="digitar(nome, $event)"
      ></ion-input>

      <ion-input
        label="Data de aniversário"
        labelPlacement="stacked"
        fill="outline"
        type="date"
        [max]="hoje"
        [value]="aniversario()"
        (ionInput)="digitar(aniversario, $event)"
      ></ion-input>
      <ion-input
        label="E-mail da conta"
        labelPlacement="stacked"
        fill="outline"
        type="email"
        [value]="email()"
        [readonly]="true"
      ></ion-input>
      <p class="suave dica-email">É com este e-mail que você entra no app. Anote para não esquecer!</p>
    </section>



    <label><input type="checkbox" [checked]="receberEmails()"
      (change)="receberEmails.set($any($event.target).checked)" /> Receber por e-mail convites, resultados da roleta e encontros</label>
    @if (erro()) {
      <p class="erro" role="alert">{{ erro() }}</p>
    }

    <ion-button expand="block" size="large" [disabled]="salvando()" (click)="salvar()">
      @if (salvando()) {
        <ion-spinner name="dots"></ion-spinner>
      } @else {
        Salvar mudanças
      }
    </ion-button>

    } @else {
      <app-livros-lidos></app-livros-lidos>
      <app-resenhas-pessoais [perfilId]="auth.perfil()?.id ?? ''"></app-resenhas-pessoais>
      <app-conversas></app-conversas>
    }
    <ion-button expand="block" fill="clear" color="medium" (click)="sair()">Sair da conta</ion-button>
  </div>
</ion-content>
